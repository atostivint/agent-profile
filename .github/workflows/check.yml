name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: pip install markdown==3.7

      - name: Regenerate the site from index.md
        run: python3 scripts/build.py --date "$(git log -1 --format=%cs)"

      - name: Generated files must match the source
        run: |
          if ! git diff --exit-code -- index.md index.html llms.txt AGENTS.md; then
            echo "::error::Generated files are stale. Run 'python3 scripts/build.py' and commit the result."
            exit 1
          fi

      - name: Links must resolve
        run: python3 scripts/check_links.py

  drift:
    # The CV repo is private: without the CV_REPO_TOKEN secret this job says so
    # and does nothing. Facts drift silently otherwise, so run it locally too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone the CV sources
        env:
          CV_REPO_TOKEN: ${{ secrets.CV_REPO_TOKEN }}
        run: |
          if [ -z "$CV_REPO_TOKEN" ]; then
            echo "::notice::CV_REPO_TOKEN absent - drift check skipped (run scripts/verify_facts.py locally)"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${CV_REPO_TOKEN}@github.com/atostivint/curriculum-vitae.git" /tmp/cv

      - name: Verify facts against the CV
        run: |
          if [ -d /tmp/cv ]; then
            python3 scripts/verify_facts.py /tmp/cv
          else
            echo "no CV sources available, skipping"
          fi
